trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  testResultsDirectory: $(Agent.TempDirectory)/TestResults

steps:
  - task: UseDotNet@2
    displayName: Instalar .NET SDK 10
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet restore
    displayName: Restaurar dependencias

  - script: dotnet build --configuration $(buildConfiguration) --no-restore
    displayName: Compilar

  - script: >
      dotnet test
      --configuration $(buildConfiguration)
      --no-build
      --logger trx
      --collect "XPlat Code Coverage"
      --results-directory $(testResultsDirectory)
    displayName: Correr tests

  - task: PublishTestResults@2
    displayName: Publicar resultados de tests
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: $(testResultsDirectory)/**/*.trx

  - task: PublishCodeCoverageResults@2
    displayName: Publicar cobertura de código
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: $(testResultsDirectory)/**/coverage.cobertura.xml

  - script: docker build --tag turnos-medicos-api:$(Build.BuildId) .
    displayName: Verificar que la imagen Docker compila
